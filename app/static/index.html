<style>
  /* Layout: one centered column, everything settled on the vertical midline.
     Mood: an analog page under a reading glass. Ink on aged paper, no bright
     color. the care is in the paper, the type, and the quiet. */
  :root{
    --bg:#e7e1d3;          /* aged paper */
    --panel:#f1ece0;       /* a lighter slip of paper for the field */
    --ink:#312b22;         /* sepia ink */
    --muted:#6d6453;       /* faded ink */
    --faint:#a89d88;       /* very faded */
    --line:#cabfaa;        /* pressed rule */
    --serif:"EB Garamond",Garamond,Georgia,serif;
    --type:"Courier Prime","Courier New",monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#1b1812;          /* dark room, warm */
    --panel:#232019;
    --ink:#e8e1cf;         /* warm paper text */
    --muted:#a89d86;
    --faint:#6b6353;
    --line:#352f27;
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#1b1812; --panel:#232019; --ink:#e8e1cf; --muted:#a89d86;
    --faint:#6b6353; --line:#352f27; color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--serif); font-size:18px; line-height:1.6;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding-block:6vh 6vh;
    padding-left:max(20px,env(safe-area-inset-left,0px));
    padding-right:max(20px,env(safe-area-inset-right,0px));
  }
  /* faint paper grain, drawn not loaded */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
    background-image:radial-gradient(var(--faint) .5px, transparent .6px);
    background-size:4px 4px; mix-blend-mode:multiply;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body::before{mix-blend-mode:screen; opacity:.06}}
  :root[data-theme="dark"] body::before{mix-blend-mode:screen; opacity:.06}

  main{width:100%; max-width:500px; margin:0 auto; position:relative; z-index:1}

  .brand{
    font-family:var(--type); font-size:12px; letter-spacing:.34em; text-transform:uppercase;
    color:var(--muted); margin-bottom:40px; font-weight:400;
  }

  /* ---- Composer ---- */
  .composer{display:flex; flex-direction:column; align-items:center; transition:opacity .45s ease}
  .prompt{
    font-family:var(--serif); font-weight:400; font-size:clamp(27px,8vw,36px);
    line-height:1.25; text-wrap:balance; margin:0 0 28px; color:var(--ink);
  }

  /* the reading glass */
  .lens{position:relative; width:100%; border-radius:999px/60px}
  .lens textarea{
    display:block; width:100%; border:1px solid var(--line); background:var(--panel);
    border-radius:18px; padding:22px 24px; resize:none; overflow:hidden;
    font-family:var(--serif); font-weight:400; font-size:clamp(22px,6.5vw,27px);
    line-height:1.45; color:var(--ink); text-align:center; outline:none;
    min-height:72px; box-shadow:inset 0 1px 0 rgba(255,255,255,.35), inset 0 0 22px rgba(0,0,0,.05);
    transition:border-color .25s ease;
  }
  .lens textarea::placeholder{color:var(--faint); font-style:italic; font-size:19px}
  .lens textarea:focus{border-color:var(--muted)}
  /* convex glass sheen over the typed words */
  .lens::after{
    content:""; position:absolute; inset:0; border-radius:18px; pointer-events:none;
    background:
      linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,0) 34%),
      radial-gradient(130% 70% at 50% 6%, rgba(255,255,255,.16), transparent 60%);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lens::after{
    background:linear-gradient(180deg, rgba(255,255,255,.07), transparent 40%);}}
  :root[data-theme="dark"] .lens::after{background:linear-gradient(180deg, rgba(255,255,255,.07), transparent 40%)}
  /* engraved magnifier, resting in the corner */
  .loupe{position:absolute; right:14px; bottom:12px; width:22px; height:22px; opacity:.22; pointer-events:none; color:var(--muted)}

  .say{
    margin-top:26px; font-family:var(--type); font-weight:400; font-size:15px;
    letter-spacing:.06em; color:var(--bg); background:var(--ink);
    border:0; border-radius:4px; padding:14px 34px; cursor:pointer; min-height:48px;
    transition:opacity .2s ease, transform .08s ease;
  }
  .say:hover{opacity:.9}
  .say:active{transform:translateY(1px)}
  .say:disabled{opacity:.4; cursor:default}
  .hint{margin-top:18px; font-family:var(--type); font-size:11.5px; letter-spacing:.05em;
    color:var(--faint); line-height:1.8}
  :focus-visible{outline:2px solid var(--muted); outline-offset:3px}

  /* ---- Response ---- */
  .response{display:flex; flex-direction:column; align-items:center}
  .echo{
    font-family:var(--serif); font-style:italic; font-weight:400; font-size:20px;
    color:var(--muted); text-wrap:balance; margin:0 0 32px; max-width:30ch; line-height:1.5;
  }
  .lead{
    font-family:var(--serif); font-weight:400; font-size:clamp(30px,9vw,40px);
    line-height:1.18; text-wrap:balance; margin:0 0 10px; color:var(--ink);
  }
  .count-num{font-weight:500; border-bottom:2px solid var(--line); padding-bottom:1px}
  .sub{font-family:var(--serif); font-weight:400; font-size:20px; color:var(--muted);
    text-wrap:balance; margin:0 auto; max-width:30ch}
  .where{font-family:var(--type); font-size:12.5px; letter-spacing:.03em; color:var(--muted);
    margin:26px auto 0; max-width:36ch; line-height:1.9}

  .suggest{margin-top:38px; width:100%}
  .suggest-label{font-family:var(--type); font-size:11px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--faint); margin-bottom:16px}
  .pills{display:flex; flex-wrap:wrap; gap:10px; justify-content:center}
  .pill{font-family:var(--serif); font-style:italic; font-weight:400; font-size:17px;
    color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:3px;
    padding:9px 15px; cursor:pointer; transition:border-color .2s ease}
  .pill:hover{border-color:var(--muted)}
  .pill .n{font-family:var(--type); font-style:normal; font-size:11px; color:var(--faint); margin-left:9px}

  .care{margin-top:38px; width:100%; background:var(--panel); border:1px solid var(--line);
    border-radius:8px; padding:22px; text-align:center}
  .care p{font-family:var(--serif); font-size:18px; margin:0 0 14px; color:var(--ink)}
  .care ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px}
  .care li{font-family:var(--type); font-size:13px; color:var(--muted); line-height:1.6}
  .care b{color:var(--ink)}
  .care a{color:var(--ink); text-decoration:underline}

  .again{margin:44px auto 0; background:none; border:0; cursor:pointer;
    font-family:var(--type); font-size:12px; letter-spacing:.08em; color:var(--muted);
    border-bottom:1px solid var(--line); padding:5px 2px}
  .again:hover{color:var(--ink)}

  /* ---- Share ---- */
  .share{margin-top:38px; width:100%; display:flex; flex-direction:column; align-items:center}
  .card{display:block; width:150px; aspect-ratio:9/16; border:1px solid var(--line); border-radius:6px;
    background:var(--panel); object-fit:cover; box-shadow:0 1px 6px rgba(0,0,0,.08)}
  .incl{margin-top:16px; font-family:var(--type); font-size:12.5px; letter-spacing:.03em; color:var(--muted);
    display:flex; align-items:center; gap:8px; cursor:pointer}
  .incl input{accent-color:var(--ink); width:16px; height:16px; margin:0}
  .share .say{margin-top:18px}
  .share-more{display:flex; gap:22px; justify-content:center; margin-top:16px}
  .link-btn{background:none; border:0; cursor:pointer; font-family:var(--type); font-size:12px;
    letter-spacing:.08em; color:var(--muted); border-bottom:1px solid var(--line); padding:5px 2px}
  .link-btn:hover{color:var(--ink)}
  .link-btn:disabled, .share .say:disabled{opacity:.4; cursor:default}
  .share-note{margin-top:12px; font-family:var(--type); font-size:11.5px; color:var(--faint); line-height:1.7; min-height:1.7em; max-width:34ch}
  .tally{margin-top:10px; font-family:var(--type); font-size:11.5px; letter-spacing:.05em; color:var(--muted)}
  .from{font-family:var(--serif); font-style:italic; font-size:19px; color:var(--muted); margin:0 0 22px; text-wrap:balance}
  .credit{position:relative; z-index:1; margin-top:48px; font-family:var(--type); font-size:10.5px; color:var(--faint)}
  .credit a{color:inherit}

  .visits{position:relative; z-index:1; margin-top:56px; width:100%; max-width:30rem; margin-left:auto; margin-right:auto;
    font-family:var(--type); font-size:12px; letter-spacing:.04em; color:var(--muted)}
  .visits summary{list-style:none; cursor:pointer; display:inline-block; border-bottom:1px solid var(--line); padding:4px 2px}
  .visits summary::-webkit-details-marker{display:none}
  .visits summary:hover{color:var(--ink)}
  .visits[open] summary{color:var(--ink)}
  .visits .today{display:block; margin-top:8px; font-size:11px; color:var(--faint)}
  .places-t{width:100%; margin:20px 0 0; border-collapse:collapse; font-size:12px; text-align:left}
  .places-t caption{caption-side:top; text-align:center; font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--faint); padding-bottom:10px}
  .places-t th{font-weight:400; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); padding:6px 4px; border-bottom:1px solid var(--line)}
  .places-t td{padding:7px 4px; border-bottom:1px dotted var(--line); color:var(--ink)}
  .places-t td.n, .places-t th.n{text-align:right; font-variant-numeric:tabular-nums; width:6.5em}
  .places-t td.n{color:var(--muted)}
  .cities{margin-top:18px; font-size:11.5px; line-height:1.9; color:var(--muted); text-wrap:balance}
  .visits .fine{margin-top:16px; font-size:10.5px; color:var(--faint); line-height:1.7}

  .fade{animation:fade .8s ease forwards}
  @keyframes fade{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion:reduce){.fade{animation:none} .composer{transition:none}}
</style>
</head>
<body>
<main>
  <div class="brand">you are not alone</div>

  <form class="composer" id="composer">
    <p class="from" id="from" hidden></p>
    <h1 class="prompt">What's on your mind?</h1>
    <div class="lens">
      <textarea id="thought" rows="1" maxlength="280" placeholder="say it plainly, however it comes" aria-label="your thought"></textarea>
      <svg class="loupe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="7"></circle><line x1="15.8" y1="15.8" x2="21" y2="21"></line>
      </svg>
    </div>
    <button class="say" id="send" type="submit">Let it out</button>
    <div class="hint">no names. no accounts. only the feeling.</div>
    <div class="tally" id="tally" hidden></div>
  </form>

  <section class="response" id="response" hidden aria-live="polite"></section>
</main>
<details class="visits" id="visits" hidden>
  <summary id="visitsSum"></summary>
  <div id="visitsBody"></div>
</details>
<footer class="credit"><a href="https://db-ip.com" target="_blank" rel="noopener">IP Geolocation by DB-IP</a></footer>

<script>
const $ = s => document.querySelector(s);
const ta = $("#thought"), composer = $("#composer"), response = $("#response");

function grow(){ ta.style.height="auto"; ta.style.height=Math.min(ta.scrollHeight,240)+"px"; }
ta.addEventListener("input", grow);
composer.addEventListener("submit", e => { e.preventDefault(); submit(); });
ta.addEventListener("keydown", e => {
  if(e.key==="Enter" && (e.metaKey||e.ctrlKey)){ e.preventDefault(); submit(); }
});

function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function placesLine(countries, cities){
  const names = (countries||[]).filter(c => c.country && c.country!=="Unknown").map(c=>c.country);
  if(!names.length) return "";
  let where;
  if(names.length===1) where = names[0];
  else if(names.length===2) where = names[0]+" and "+names[1];
  else where = names[0]+", "+names[1]+", and "+(names.length-2)+" other place"+(names.length-2>1?"s":"");
  const city = (cities||[]).find(c => c.city && c.country!=="Unknown");
  const near = city ? `, including someone near ${esc(city.city)}` : "";
  return `with people in ${esc(where)}${near}`;
}

function render(d){
  const others = d.others_feeling_this, parts = [];
  parts.push(`<p class="echo">${esc(d.you_said)}</p>`);
  if(others > 0){
    const ppl = others===1 ? "one other person has" : `<span class="count-num">${others}</span> others have`;
    parts.push(`<h2 class="lead">you're not alone.</h2>`);
    parts.push(`<p class="sub">${ppl} felt this too.</p>`);
  } else {
    parts.push(`<h2 class="lead">you're the first to say this here.</h2>`);
    parts.push(`<p class="sub">by putting it into words, you made it easier for whoever feels it next.</p>`);
  }
  const where = placesLine(d.countries, d.cities);
  if(where) parts.push(`<p class="where">${where}</p>`);
  if(d.share){
    parts.push(`<div class="share">
      <div class="suggest-label">pass it on</div>
      <img class="card" id="card" alt="your card">
      <label class="incl"><input type="checkbox" id="incl" checked> include my words</label>
      <button class="say" type="button" id="shareBtn" disabled>Share</button>
      <div class="share-more">
        <button class="link-btn" type="button" id="saveBtn" disabled>save image</button>
        <button class="link-btn" type="button" id="copyBtn" disabled>copy link</button>
      </div>
      <div class="share-note" id="shareNote"></div>
    </div>`);
  }
  if(d.crisis){
    const lines = d.crisis.lines.map(l => {
      const c = l.contact.startsWith("http")
        ? `<a href="${esc(l.contact)}" target="_blank" rel="noopener">${esc(l.contact)}</a>` : esc(l.contact);
      return `<li><b>${esc(l.where)}:</b> ${esc(l.name)}, ${c}</li>`;
    }).join("");
    parts.push(`<div class="care"><p>${esc(d.crisis.message)}</p><ul>${lines}</ul></div>`);
  }
  if(d.suggestions && d.suggestions.length){
    const pills = d.suggestions.map(s =>
      `<button class="pill" type="button" data-t="${esc(s.thought)}">${esc(s.thought)}${s.people ? `<span class="n">${s.people}</span>` : ""}</button>`
    ).join("");
    parts.push(`<div class="suggest"><div class="suggest-label">close to what you said</div><div class="pills">${pills}</div></div>`);
  }
  parts.push(`<button class="again" type="button" id="again">say something else</button>`);

  response.innerHTML = parts.join("");
  response.classList.remove("fade"); void response.offsetWidth; response.classList.add("fade");
  response.hidden = false;
  response.querySelectorAll(".pill").forEach(p => p.addEventListener("click", () => {
    ta.value = p.dataset.t; reset(false); grow(); submit();
  }));
  $("#again").addEventListener("click", () => reset(true));
  if(d.share) setupShare(d.share);
  response.scrollIntoView({behavior:"smooth", block:"center"});
}

// ---- sharing ----
let shareState = null;

async function prepareShare(include){
  const st = shareState, key = include ? "with" : "without";
  if(st.ready[key]) return st.ready[key];
  const body = JSON.stringify({thought_id: st.auth.thought_id, token: st.auth.token, show_text: include});
  const opts = {method:"POST", headers:{"content-type":"application/json"}, body};
  const [link, card] = await Promise.all([
    fetch("/api/share", opts).then(r => { if(!r.ok) throw 0; return r.json(); }),
    fetch("/api/card", opts).then(r => { if(!r.ok) throw 0; return r.blob(); }),
  ]);
  const ready = {link, blob: card, src: URL.createObjectURL(card)};
  st.ready[key] = ready;
  return ready;
}

async function showShare(){
  const include = $("#incl").checked, note = $("#shareNote");
  ["#shareBtn","#saveBtn","#copyBtn"].forEach(s => $(s).disabled = true);
  note.textContent = "";
  try{
    const r = await prepareShare(include);
    if(include !== $("#incl").checked) return;  // toggled again meanwhile
    $("#card").src = r.src;
    ["#shareBtn","#saveBtn","#copyBtn"].forEach(s => $(s).disabled = false);
    if(r.link.words === "pending")
      note.textContent = "the link shows your words once they've been checked, usually within a few minutes.";
  }catch(e){
    note.textContent = "sharing isn't available right now.";
  }
}

function setupShare(auth){
  shareState = {auth, ready:{}};
  $("#incl").addEventListener("change", showShare);
  $("#shareBtn").addEventListener("click", async () => {
    const r = shareState.ready[$("#incl").checked ? "with" : "without"];
    if(!r) return;
    const url = r.link.url, text = "you are not alone.";
    const file = new File([r.blob], "not-alone.jpg", {type:"image/jpeg"});
    try{
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], text: `${text} ${url}`});
      } else if(navigator.share){
        await navigator.share({text, url});
      } else {
        await navigator.clipboard.writeText(url);
        $("#shareNote").textContent = "link copied.";
      }
    }catch(e){ /* closed the share sheet */ }
  });
  $("#saveBtn").addEventListener("click", () => {
    const r = shareState.ready[$("#incl").checked ? "with" : "without"];
    if(!r) return;
    const a = document.createElement("a");
    a.href = r.src; a.download = "not-alone.jpg"; document.body.appendChild(a); a.click(); a.remove();
  });
  $("#copyBtn").addEventListener("click", async () => {
    const r = shareState.ready[$("#incl").checked ? "with" : "without"];
    if(!r) return;
    try{ await navigator.clipboard.writeText(r.link.url); $("#shareNote").textContent = "link copied."; }
    catch(e){ $("#shareNote").textContent = r.link.url; }
  });
  showShare();
}

// Arriving from someone's shared link: offer their words, ready to send.
async function arrivedFrom(){
  const id = new URLSearchParams(location.search).get("from");
  if(!id) return;
  history.replaceState(null, "", "/");
  try{
    const r = await fetch(`/api/share/${encodeURIComponent(id)}`);
    if(!r.ok) return;
    const d = await r.json(), from = $("#from");
    if(d.text){
      ta.value = d.text; grow();
      from.textContent = "someone shared this. if you feel it too, let it out.";
    } else {
      from.textContent = "someone said what was on their mind here, and found they weren't alone.";
    }
    from.hidden = false;
  }catch(e){}
}

function reset(focus){
  response.hidden = true; response.innerHTML = ""; shareState = null;
  $("#from").hidden = true;
  composer.style.opacity = "";
  if(focus){ ta.value=""; grow(); ta.focus(); }
}

async function submit(){
  const text = ta.value.trim();
  if(!text){ ta.focus(); return; }
  const btn = $("#send"); btn.disabled = true; composer.style.opacity = ".3";
  try{
    const r = await fetch("/api/thoughts", {
      method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({text})
    });
    if(!r.ok){
      let msg = "";
      if(r.status === 503 || r.status === 429){ try{ msg = (await r.json()).detail; }catch(_){} }
      throw new Error(msg);
    }
    render(await r.json());
  }catch(e){
    composer.style.opacity = ""; $("#send").disabled = false;
    $(".hint").textContent = e.message || "that did not send. try once more.";
    return;
  }
  btn.disabled = false;
}

// Live tally, shown only once it's big enough to feel like company.
fetch("/api/stats").then(r => r.ok ? r.json() : null).then(d => {
  if(!d || d.thoughts < 100) return;
  const t = $("#tally");
  t.textContent = `${d.thoughts.toLocaleString()} thoughts let out so far.`;
  t.hidden = false;
}).catch(() => {});

// Count this visit, then show the public counter and where people are.
const nf = n => Number(n).toLocaleString();
const plural = (n, one, many) => `${nf(n)} ${n === 1 ? one : many}`;
fetch("/api/visit", {method:"POST"}).catch(() => {}).finally(() => {
  fetch("/api/views").then(r => r.ok ? r.json() : null).then(d => {
    if(!d || !d.views) return;
    const cs = d.countries || [];
    const bits = [plural(d.views, "visit", "visits"), plural(d.visitors, "person", "people")];
    if(cs.length) bits.push(plural(cs.length, "country", "countries"));
    $("#visitsSum").innerHTML = esc(bits.join(" \u00b7 ")) +
      `<span class="today">today: ${esc(plural(d.views_today, "visit", "visits"))}, ${esc(plural(d.visitors_today, "person", "people"))}</span>`;
    let h = "";
    if(cs.length){
      h += `<table class="places-t"><caption>where people are</caption>
        <thead><tr><th>country</th><th class="n">visited</th><th class="n">let it out</th></tr></thead><tbody>` +
        cs.map(c => `<tr><td>${esc(c.country)}</td><td class="n">${nf(c.visitors)}</td><td class="n">${nf(c.posters)}</td></tr>`).join("") +
        `</tbody></table>`;
    }
    if((d.cities || []).length){
      h += `<div class="cities">cities: ${d.cities.map(c => esc(`${c.city} (${nf(c.visitors)})`)).join(", ")}</div>`;
    }
    h += `<div class="fine">counted once per person per day. no addresses are kept, and a city only shows once 3 or more people came from it.</div>`;
    $("#visitsBody").innerHTML = h;
    $("#visits").hidden = false;
  }).catch(() => {});
});

grow(); ta.focus(); arrivedFrom();
</script>
